        .modal {

        .form-group input:focus { outline: none; border-color: #06d6a0; }

            .anime-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
            .anime-card img { height: 220px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">

            ];

            const closeModal = (id) => { document.getElementById(id).style.display = 'none'; };
            const openModal = (id) => { document.getElementById(id).style.display = 'flex'; };

            // 生成 SVG 占位图（作为兜底，确保图片不会裂开或消失）
            const createFallbackSVG = (title) => {
                const colors = ["#ff7b54", "#ffd166", "#06d6a0", "#00b4d8", "#ff4d6d"];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                // 对中文进行 URL 编码以确保 SVG 安全
                const encodedTitle = encodeURIComponent(title);
                return `data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='450' viewBox='0 0 300 450'><rect width='300' height='450' fill='${randomColor}'/><text x='50%25' y='40%25' font-size='30' fill='white' font-family='sans-serif' font-weight='bold' text-anchor='middle' dy='.3em'>${encodedTitle}</text><text x='50%25' y='65%25' font-size='16' fill='rgba(255,255,255,0.8)' font-family='sans-serif' text-anchor='middle'>封面加载中...</text></svg>`;
            };

            const renderAnime = (list, container = DOM.animeGrid) => {
                container.innerHTML = '';
                if (!list.length) {
                    container.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:50px;color:rgba(255,255,255,0.5);">未找到相关动漫</p>';
                    return;
                }
                list.forEach(anime => {
                    const isFav = favorites.includes(anime.id);
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    
                    // 核心修复：图片加载失败时自动替换为 SVG 海报
                    const imgSrc = anime.image;
                    const fallbackSrc = createFallbackSVG(anime.title);

                    card.innerHTML = `
                        <img src="${imgSrc}" alt="${anime.title}" loading="lazy" referrerpolicy="no-referrer" crossorigin="anonymous" 
                             onerror="this.onerror=null;this.src='${fallbackSrc}';">
                        <div class="anime-info">
                            <h3 class="anime-title">${anime.title}</h3>
                            <div class="anime-meta">
                                <span class="anime-category">${anime.categoryLabel}</span>
                                <span class="anime-episodes">${anime.episodes}</span>
                            </div>
                            <div class="anime-actions">
                                <button class="btn-watch" data-id="${anime.id}">▶ 观看</button>
                                <button class="btn-favorite ${isFav ? 'active' : ''}" data-id="${anime.id}">${isFav ? '❤️' : '🤍'}</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            };

            // 全局事件委托：处理所有动态生成的按钮
            document.addEventListener('click', (e) => {
                const target = e.target;
                const watchBtn = target.closest('.btn-watch');
                const favBtnItem = target.closest('.btn-favorite');

                // 点击观看
                if (watchBtn) {
                    const id = parseInt(watchBtn.dataset.id);
                    const anime = animeList.find(a => a.id === id);
                    document.getElementById('videoTitle').textContent = anime.title;
                    document.getElementById('videoDescription').textContent = anime.description;
                    const linkList = document.getElementById('linkList');
                    linkList.innerHTML = '';
                    
                    SITE_CONFIG.forEach(site => {
                        const a = document.createElement('a');
                        a.className = 'link-item';
                        a.href = '#';
                        a.innerHTML = `
                            <div class="link-site"><span class="link-site-icon">${site.icon}</span><div><div class="link-site-name">${site.name}</div><div class="link-site-desc">${site.desc}</div></div></div>
                            <span class="link-arrow">→</span>
                        `;
                        a.addEventListener('click', (ev) => {
                            ev.preventDefault();
                            closeModal('videoModal');
                            // 修复跳转：使用新窗口打开，避免拦截
                            window.open(site.base + encodeURIComponent(anime.title), '_blank', 'noopener,noreferrer');
                        });
                        linkList.appendChild(a);
                    });
                    openModal('videoModal');
                }

                // 点击收藏
                if (favBtnItem) {
                    if (!currentUser) { openModal('loginModal'); return; }
                    const id = parseInt(favBtnItem.dataset.id);
                    const idx = favorites.indexOf(id);
                    if (idx > -1) favorites.splice(idx, 1);
                    else favorites.push(id);
                    favBtnItem.classList.toggle('active');
                    favBtnItem.textContent = idx > -1 ? '🤍' : '❤️';
                }
                
                // 点击模态框关闭
                const closeBtn = target.closest('.close-btn');
                if (closeBtn) {
                    closeModal(closeBtn.dataset.close);
                }
                // 点击模态框背景关闭
                if (target.classList.contains('modal')) {
                    target.style.display = 'none';
                }
            });

            // 分类筛选
            DOM.categoryTabs.addEventListener('click', (e) => {
                const btn = e.target.closest('.tab-btn');
                if (!btn) return;
                DOM.tabButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const cat = btn.dataset.category;
                renderAnime(cat === 'all' ? animeList : animeList.filter(a => a.category === cat));
            });

            // 搜索
            const performSearch = () => {
                const query = DOM.searchInput.value.trim().toLowerCase();
                if (!query) { renderAnime(animeList); return; }
                const filtered = animeList.filter(a => a.title.toLowerCase().includes(query) || a.categoryLabel.includes(query));
                renderAnime(filtered);
            };
            DOM.searchBtn.addEventListener('click', performSearch);
            DOM.searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });

            // 登录/注册/退出
            DOM.loginBtn.addEventListener('click', () => openModal('loginModal'));
            DOM.registerBtn.addEventListener('click', () => openModal('registerModal'));
            DOM.loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('loginUsername').value;
                const p = document.getElementById('loginPassword').value;
                const found = users.find(user => user.username === u && user.password === p);
                if (found) {
                    currentUser = found; closeModal('loginModal'); updateAuthUI();
                    document.getElementById('loginError').textContent = '';
                } else {
                    document.getElementById('loginError').textContent = '账号或密码错误';
                }
            });
            DOM.registerForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('registerUsername').value;
                const p = document.getElementById('registerPassword').value;
                const c = document.getElementById('confirmPassword').value;
                const errEl = document.getElementById('registerError');
                errEl.textContent = '';
                if (p !== c) { errEl.textContent = '密码不一致'; return; }
                if (users.find(user => user.username === u)) { errEl.textContent = '用户已存在'; return; }
                users.push({ username: u, password: p });
                currentUser = users[users.length - 1]; closeModal('registerModal'); updateAuthUI();
            });
            DOM.logoutBtn.addEventListener('click', () => {
                currentUser = null; favorites = []; updateAuthUI(); hideFavorites();
            });

            const updateAuthUI = () => {
                if (currentUser) {
                    DOM.notLoggedIn.style.display = 'none';
                    DOM.loggedIn.style.display = 'flex';
                    DOM.currentUserName.textContent = currentUser.username;
                } else {
                    DOM.notLoggedIn.style.display = 'flex';
                    DOM.loggedIn.style.display = 'none';
                }
            };

            // 收藏页
            DOM.favBtn.addEventListener('click', () => {
                DOM.mainContent.style.display = 'none';
                DOM.favoritesPage.style.display = 'block';
                renderFavorites();
            });
            DOM.backHomeBtn.addEventListener('click', hideFavorites);
            function hideFavorites() { DOM.mainContent.style.display = 'block'; DOM.favoritesPage.style.display = 'none'; }

            function renderFavorites() {
                const favsGrid = document.getElementById('favoritesGrid');
                const noFavs = document.getElementById('noFavorites');
                favsGrid.innerHTML = '';
                const favList = animeList.filter(a => favorites.includes(a.id));
                if (!favList.length) {
                    noFavs.style.display = 'block';
                } else {
                    noFavs.style.display = 'none';
                    renderAnime(favList, favsGrid);
                }
            }

            // 初始渲染
            renderAnime(animeList);
        });
    </script>
</body>
</html>
