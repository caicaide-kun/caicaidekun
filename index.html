        // 当前用户
        let currentUser = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            renderAnimeList(animeList);
        });

        // 检查登录状态
        function checkLoginStatus() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                updateUIForLoggedIn();
            }
        }

        // 更新已登录状态的UI
        function updateUIForLoggedIn() {
            document.getElementById('notLoggedIn').style.display = 'none';
            document.getElementById('loggedIn').style.display = 'flex';
            document.getElementById('currentUserName').textContent = currentUser.username;
        }

        // 渲染动漫列表
        function renderAnimeList(animes) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = '';

            animes.forEach(anime => {
                const isFavorite = checkIfFavorite(anime.id);
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <img src="${anime.image}" alt="${anime.title}" onerror="this.src='https://via.placeholder.com/400x500/667eea/ffffff?text=${encodeURIComponent(anime.title)}'">
                    <div class="anime-info">
                        <div class="anime-title">${anime.title}</div>
                        <div class="anime-meta">
                            <span class="anime-category">${anime.categoryLabel}</span>
                            <span class="anime-episodes">${anime.episodes}</span>
                        </div>
                        <div class="anime-actions">
                            <button class="btn-watch" onclick="watchAnime(${anime.id})">观看</button>
                            <button class="btn-favorite ${isFavorite ? 'active' : ''}" onclick="toggleFavorite(event, ${anime.id})">
                                ${isFavorite ? '❤️' : '🤍'}
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 检查是否已收藏
        function checkIfFavorite(animeId) {
            if (!currentUser) return false;
            const favorites = JSON.parse(localStorage.getItem('favorites_' + currentUser.username) || '[]');
            return favorites.includes(animeId);
        }

        // 切换收藏状态
        function toggleFavorite(event, animeId) {
            event.stopPropagation();

            if (!currentUser) {
                alert('请先登录后再收藏');
                showLoginModal();
                return;
            }

            let favorites = JSON.parse(localStorage.getItem('favorites_' + currentUser.username) || '[]');
            const btn = event.target;

            if (favorites.includes(animeId)) {
                favorites = favorites.filter(id => id !== animeId);
                btn.classList.remove('active');
                btn.innerHTML = '🤍';
            } else {
                favorites.push(animeId);
                btn.classList.add('active');
                btn.innerHTML = '❤️';
            }

            localStorage.setItem('favorites_' + currentUser.username, JSON.stringify(favorites));
        }

        // 观看动漫
        function watchAnime(animeId) {
            const anime = animeList.find(a => a.id === animeId);
            if (anime) {
                document.getElementById('videoTitle').textContent = anime.title;
                document.getElementById('videoDescription').textContent = anime.description;
                document.getElementById('videoFrame').src = anime.videoUrl;
                document.getElementById('videoModal').style.display = 'flex';
            }
        }

        // 关闭视频弹窗
        function closeVideoModal() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('videoFrame').src = '';
        }

        // 显示登录弹窗
        function showLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('loginError').textContent = '';
        }

        // 关闭登录弹窗
        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }

        // 显示注册弹窗
        function showRegisterModal() {
            document.getElementById('registerModal').style.display = 'flex';
            document.getElementById('registerError').textContent = '';
        }

        // 关闭注册弹窗
        function closeRegisterModal() {
            document.getElementById('registerModal').style.display = 'none';
            document.getElementById('registerUsername').value = '';
            document.getElementById('registerPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        // 处理登录
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            const users = JSON.parse(localStorage.getItem('users') || '{}');

            if (!users[username]) {
                document.getElementById('loginError').textContent = '用户不存在';
                return;
            }

            if (users[username] !== password) {
                document.getElementById('loginError').textContent = '密码错误';
                return;
            }

            currentUser = { username: username };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            updateUIForLoggedIn();
            closeLoginModal();
            renderAnimeList(animeList);
        }

        // 处理注册
        function handleRegister(event) {
            event.preventDefault();

            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (username.length < 3) {
                document.getElementById('registerError').textContent = '用户名至少需要3个字符';
                return;
            }

            if (password.length < 6) {
                document.getElementById('registerError').textContent = '密码至少需要6个字符';
                return;
            }

            if (password !== confirmPassword) {
                document.getElementById('registerError').textContent = '两次输入的密码不一致';
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '{}');

            if (users[username]) {
                document.getElementById('registerError').textContent = '用户名已存在';
                return;
            }

            users[username] = password;
            localStorage.setItem('users', JSON.stringify(users));

            alert('注册成功！请登录');
            closeRegisterModal();
            showLoginModal();
        }

        // 退出登录
        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('notLoggedIn').style.display = 'flex';
            document.getElementById('loggedIn').style.display = 'none';
            renderAnimeList(animeList);
        }

        // 显示收藏页面
        function showFavorites() {
            if (!currentUser) return;

            document.querySelector('.main-content').style.display = 'none';
            document.getElementById('favoritesPage').style.display = 'block';

            renderFavorites();
        }

        // 隐藏收藏页面
        function hideFavorites() {
            document.getElementById('favoritesPage').style.display = 'none';
            document.querySelector('.main-content').style.display = 'block';
        }

        // 渲染收藏列表
        function renderFavorites() {
            const favorites = JSON.parse(localStorage.getItem('favorites_' + currentUser.username) || '[]');
            const grid = document.getElementById('favoritesGrid');
            const noFavorites = document.getElementById('noFavorites');

            if (favorites.length === 0) {
                grid.innerHTML = '';
                noFavorites.style.display = 'block';
                return;
            }

            noFavorites.style.display = 'none';
            grid.innerHTML = '';

            favorites.forEach(animeId => {
                const anime = animeList.find(a => a.id === animeId);
                if (anime) {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    card.innerHTML = `
                        <img src="${anime.image}" alt="${anime.title}" onerror="this.src='https://via.placeholder.com/400x500/667eea/ffffff?text=${encodeURIComponent(anime.title)}'">
                        <div class="anime-info">
                            <div class="anime-title">${anime.title}</div>
                            <div class="anime-meta">
                                <span class="anime-category">${anime.categoryLabel}</span>
                                <span class="anime-episodes">${anime.episodes}</span>
                            </div>
                            <div class="anime-actions">
                                <button class="btn-watch" onclick="watchAnime(${anime.id})">观看</button>
                                <button class="btn-favorite active" onclick="removeFavorite(event, ${anime.id})">❤️</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });
        }

        // 从收藏移除
        function removeFavorite(event, animeId) {
            event.stopPropagation();

            let favorites = JSON.parse(localStorage.getItem('favorites_' + currentUser.username) || '[]');
            favorites = favorites.filter(id => id !== animeId);
            localStorage.setItem('favorites_' + currentUser.username, JSON.stringify(favorites));

            renderFavorites();
            renderAnimeList(animeList);
        }

        // 搜索动漫
        function searchAnime() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

            if (!keyword) {
                renderAnimeList(animeList);
                return;
            }

            const filtered = animeList.filter(anime =>
                anime.title.toLowerCase().includes(keyword) ||
                anime.categoryLabel.includes(keyword)
            );

            renderAnimeList(filtered);
        }

        // 按分类筛选
        function filterCategory(category) {
            // 更新标签激活状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            if (category === 'all') {
                renderAnimeList(animeList);
                return;
            }

            const filtered = animeList.filter(anime => anime.category === category);
            renderAnimeList(filtered);
        }

        // 点击搜索框按回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchAnime();
            }
        });

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const loginModal = document.getElementById('loginModal');
            const registerModal = document.getElementById('registerModal');
            const videoModal = document.getElementById('videoModal');

            if (event.target === loginModal) {
                closeLoginModal();
            }
            if (event.target === registerModal) {
                closeRegisterModal();
            }
            if (event.target === videoModal) {
                closeVideoModal();
            }
        }
    </script>
</body>
